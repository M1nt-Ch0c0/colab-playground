name: Build, Push to GCP Artifact Registry & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: asia-east1
  AR_REGISTRY: asia-east1-docker.pkg.dev
  IMAGE_REPO: asia-east1-docker.pkg.dev/cpa-platform-e9b3/cpa-images/colab-playground

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Syntax, JS, and unit tests
        run: |
          python3 -m py_compile app.py jobs.py colab_worker.py ui.py store.py colab_backend.py
          python3 -c 'import subprocess, ui; p = subprocess.run(["node", "--check"], input=ui._JS.encode("utf-8"), capture_output=True); assert p.returncode == 0, p.stderr.decode(); print("JS_OK")'
          python3 tests/test_backend_v21.py .
          python3 tests/test_comfy_mode.py .

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP push secret
        id: check_gcp
        run: |
          if [ -n "${{ secrets.GCP_AR_SA_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret GCP_AR_SA_KEY is not configured yet; skipping push & deploy."
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_gcp.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_AR_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        if: steps.check_gcp.outputs.ready == 'true'
        run: |
          gcloud auth configure-docker "${AR_REGISTRY}" --quiet

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          STAMP=$(date -u +%Y%m%d%H%M)
          TAG="${SHORT_SHA}-${STAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE_REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check_gcp.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GCP Artifact Registry
        if: steps.check_gcp.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.IMAGE_REPO }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment (optional)
        if: steps.check_gcp.outputs.ready == 'true' && secrets.DOKPLOY_API_KEY != '' && secrets.DOKPLOY_APP_ID != ''
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL || 'https://ops.m1ntch0c0.com' }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FULL_IMAGE: ${{ steps.meta.outputs.full_image }}
        run: |
          HDRS=(-H "Content-Type: application/json" -H "x-api-key: ${DOKPLOY_API_KEY}")
          if [ -n "${CF_ID}" ] && [ -n "${CF_SECRET}" ]; then
            HDRS+=(-H "CF-Access-Client-Id: ${CF_ID}" -H "CF-Access-Client-Secret: ${CF_SECRET}")
          fi
          curl -fsSL -X POST "${DOKPLOY_URL%/}/api/application.update" \
            "${HDRS[@]}" \
            -d "{\"applicationId\":\"${DOKPLOY_APP_ID}\",\"dockerImage\":\"${FULL_IMAGE}\"}"
          curl -fsSL -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            "${HDRS[@]}" \
            -d "{\"applicationId\":\"${DOKPLOY_APP_ID}\"}"
          echo "Deployed ${FULL_IMAGE} via Dokploy."
