name: Build, Push to GCP Artifact Registry & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Skip waiting for active GPU / workflow jobs to finish before deploying"
        required: false
        type: boolean
        default: false

env:
  IMAGE_REPO: ${{ vars.IMAGE_REPO }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install --no-cache-dir -r requirements.txt selenium

      - name: Build production frontend
        working-directory: web
        run: |
          npm ci
          npm run api:check
          npm run build

      - name: Syntax, JS, and unit tests
        run: |
          python3 -m compileall -q app.py draw_studio
          python3 -c 'import subprocess; from draw_studio import legacy_ui as ui; p = subprocess.run(["node", "--check"], input=ui._JS.encode("utf-8"), capture_output=True); assert p.returncode == 0, p.stderr.decode(); print("JS_OK")'
          python3 tests/test_backend_v21.py .
          python3 tests/test_comfy_mode.py .
          python3 tests/test_workflows.py .
          python3 tests/test_web_api.py .
          python3 tests/test_web_browser.py .

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release configuration
        id: check_secrets
        env:
          GCP_KEY: ${{ secrets.GCP_AR_SA_KEY }}
          DOK_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOK_APP: ${{ secrets.DOKPLOY_APP_ID }}
          DOK_URL: ${{ vars.DOKPLOY_URL }}
          HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          if [ -n "${GCP_KEY}" ] && [ -n "${IMAGE_REPO}" ]; then
            echo "gcp_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "gcp_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set the IMAGE_REPO variable and GCP_AR_SA_KEY secret to publish images."
          fi
          if [[ -n "$GCP_KEY" && -n "$IMAGE_REPO" && -n "$DOK_KEY" && -n "$DOK_APP" && -n "$DOK_URL" && ( -n "$HEALTH_URL" || "$FORCE_DEPLOY" == "true" ) ]]; then
            echo "dokploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "dokploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Automatic deployment requires the Dokploy credentials, DOKPLOY_URL and APP_HEALTH_URL."
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_AR_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        run: |
          gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          STAMP=$(date -u +%Y%m%d%H%M)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            SAFE_TAG=$(echo "${RAW_TAG}" | sed 's/[^A-Za-z0-9._-]/-/g')
            TAG="${SAFE_TAG}-${SHORT_SHA}"
          else
            TAG="${SHORT_SHA}-${STAMP}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE_REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GCP Artifact Registry
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_ID=${{ env.BUILD_ID }}
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.IMAGE_REPO }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Wait for idle before Dokploy deploy
        if: steps.check_secrets.outputs.dokploy_ready == 'true'
        env:
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          if [ "${FORCE_DEPLOY}" = "true" ]; then
            echo "force_deploy=true; skipping idle check."
            exit 0
          fi
          MAX_WAIT=1200
          INTERVAL=15
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            BODY=$(curl -fsS --max-time 8 "$APP_HEALTH_URL" || true)
            if python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("busy") is False else 1)' <<< "$BODY" 2>/dev/null; then
              echo "Service is idle; proceeding with deployment."
              exit 0
            fi
            echo "Service busy or health endpoint unavailable; waiting ${INTERVAL}s (${ELAPSED}/${MAX_WAIT}s)..."
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "::error::Could not confirm an idle service within ${MAX_WAIT}s. Check APP_HEALTH_URL and running jobs, or dispatch with force_deploy=true."
          exit 1

      - name: Trigger Dokploy deployment (optional)
        if: steps.check_secrets.outputs.dokploy_ready == 'true'
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FULL_IMAGE: ${{ steps.meta.outputs.full_image }}
        run: |
          HDRS=(-H "Content-Type: application/json" -H "x-api-key: ${DOKPLOY_API_KEY}")
          if [ -n "${CF_ID}" ] && [ -n "${CF_SECRET}" ]; then
            HDRS+=(-H "CF-Access-Client-Id: ${CF_ID}" -H "CF-Access-Client-Secret: ${CF_SECRET}")
          fi

          call_dokploy() {
            local ep="$1"
            local body="$2"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "${DOKPLOY_URL%/}/api/${ep}" "${HDRS[@]}" -d "$body")
            echo "POST /api/${ep} -> HTTP ${code}"
            if [ "$code" = "302" ] || [ "$code" = "403" ]; then
              echo "::error::Deployment endpoint denied access (HTTP ${code}). Check the configured endpoint and access policy."
              exit 1
            fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Dokploy returned HTTP ${code} for /api/${ep}."
              exit 1
            fi
          }

          call_dokploy "application.update" "{\"applicationId\":\"${DOKPLOY_APP_ID}\",\"dockerImage\":\"${FULL_IMAGE}\"}"
          call_dokploy "application.deploy" "{\"applicationId\":\"${DOKPLOY_APP_ID}\"}"
          echo "Dokploy accepted the deployment of ${FULL_IMAGE}."

      - name: Verify the published build is serving traffic
        if: steps.check_secrets.outputs.dokploy_ready == 'true' && vars.APP_HEALTH_URL != ''
        shell: bash
        env:
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        run: |
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            live_build=$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "$APP_HEALTH_URL" |
              jq -er 'if .ok != true then "unhealthy"
                      elif .build_id == null then "missing build ID"
                      else .build_id | strings | select(test("^[0-9]+-[0-9]+$")) end') || live_build="unavailable or invalid response"
            if [[ "$live_build" == "$BUILD_ID" ]]; then
              echo "Build $BUILD_ID is healthy at the application endpoint."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Build $BUILD_ID did not become healthy within 5 minutes. Last observed ${live_build:-empty response}. Check the Dokploy rollout and Swarm task history."
          exit 1
