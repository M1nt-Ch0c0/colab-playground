name: Build, Push to GCP Artifact Registry & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Skip waiting for active GPU / workflow jobs to finish before deploying"
        required: false
        type: boolean
        default: false

env:
  GCP_REGION: asia-east1
  AR_REGISTRY: asia-east1-docker.pkg.dev
  IMAGE_REPO: asia-east1-docker.pkg.dev/cpa-platform-e9b3/cpa-images/colab-playground

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install --no-cache-dir -r requirements.txt

      - name: Syntax, JS, and unit tests
        run: |
          python3 -m py_compile app.py jobs.py workflows.py colab_worker.py ui.py store.py colab_backend.py
          python3 -c 'import subprocess, ui; p = subprocess.run(["node", "--check"], input=ui._JS.encode("utf-8"), capture_output=True); assert p.returncode == 0, p.stderr.decode(); print("JS_OK")'
          python3 tests/test_backend_v21.py .
          python3 tests/test_comfy_mode.py .
          python3 tests/test_workflows.py .

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check_secrets
        env:
          GCP_KEY: ${{ secrets.GCP_AR_SA_KEY }}
          DOK_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOK_APP: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -n "${GCP_KEY}" ]; then
            echo "gcp_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "gcp_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret GCP_AR_SA_KEY is not configured yet; skipping push & deploy."
          fi
          if [ -n "${GCP_KEY}" ] && [ -n "${DOK_KEY}" ] && [ -n "${DOK_APP}" ]; then
            echo "dokploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "dokploy_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_AR_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        run: |
          gcloud auth configure-docker "${AR_REGISTRY}" --quiet

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          STAMP=$(date -u +%Y%m%d%H%M)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            SAFE_TAG=$(echo "${RAW_TAG}" | sed 's/[^A-Za-z0-9._-]/-/g')
            TAG="${SAFE_TAG}-${SHORT_SHA}"
          else
            TAG="${SHORT_SHA}-${STAMP}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE_REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GCP Artifact Registry
        if: steps.check_secrets.outputs.gcp_ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.IMAGE_REPO }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Wait for idle before Dokploy deploy
        if: steps.check_secrets.outputs.dokploy_ready == 'true'
        env:
          APP_HEALTH_URL: https://draw.m1ntch0c0.com/healthz
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          if [ "${FORCE_DEPLOY}" = "true" ]; then
            echo "force_deploy=true; skipping idle check."
            exit 0
          fi
          MAX_WAIT=1200
          INTERVAL=15
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            BODY=$(curl -sS --max-time 8 "$APP_HEALTH_URL" || true)
            BUSY=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print("true" if d.get("busy") else "false")' "$BODY" 2>/dev/null || echo "false")
            if [ "$BUSY" != "true" ]; then
              echo "Service is idle (healthz: ${BODY:-n/a}); proceeding with deployment."
              exit 0
            fi
            echo "Active GPU or workflow job detected (${BODY}); waiting ${INTERVAL}s (${ELAPSED}/${MAX_WAIT}s)..."
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "::error::Timed out waiting ${MAX_WAIT}s for active GPU/workflow job to finish. Re-run later or use workflow_dispatch with force_deploy=true."
          exit 1

      - name: Trigger Dokploy deployment (optional)
        if: steps.check_secrets.outputs.dokploy_ready == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FULL_IMAGE: ${{ steps.meta.outputs.full_image }}
        run: |
          BASE_URL="${DOKPLOY_URL:-https://ops.m1ntch0c0.com}"
          HDRS=(-H "Content-Type: application/json" -H "x-api-key: ${DOKPLOY_API_KEY}")
          if [ -n "${CF_ID}" ] && [ -n "${CF_SECRET}" ]; then
            HDRS+=(-H "CF-Access-Client-Id: ${CF_ID}" -H "CF-Access-Client-Secret: ${CF_SECRET}")
          fi

          call_dokploy() {
            local ep="$1"
            local body="$2"
            local out="/tmp/dokploy_resp.txt"
            local code
            code=$(curl -sS -o "$out" -w "%{http_code}" -X POST "${BASE_URL%/}/api/${ep}" "${HDRS[@]}" -d "$body")
            echo "POST /api/${ep} -> HTTP ${code}"
            if [ "$code" = "302" ] || [ "$code" = "403" ]; then
              echo "::error::Cloudflare Zero Trust blocked /api/${ep} (HTTP ${code}). Ensure the Service Token policy on ops.m1ntch0c0.com uses Action = 'Service Auth' (not 'Allow')."
              exit 1
            fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              head -c 500 "$out" || true
              echo ""
              exit 1
            fi
          }

          call_dokploy "application.update" "{\"applicationId\":\"${DOKPLOY_APP_ID}\",\"dockerImage\":\"${FULL_IMAGE}\"}"
          call_dokploy "application.deploy" "{\"applicationId\":\"${DOKPLOY_APP_ID}\"}"
          echo "Deployed ${FULL_IMAGE} via Dokploy."
