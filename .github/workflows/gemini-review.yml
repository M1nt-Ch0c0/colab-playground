name: '🔎 Gemini PR Review'

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created

defaults:
  run:
    shell: bash

jobs:
  review:
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@gemini-cli /review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    concurrency:
      group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}'
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Clone official code-review extension
        run: |-
          git clone --depth 1 https://github.com/gemini-cli-extensions/code-review.git "${RUNNER_TEMP}/gemini-code-review"

      - name: Prepare prompt context
        id: context
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          COMMENT_BODY: '${{ github.event.comment.body }}'
        run: |-
          mkdir -p .gemini
          ADDITIONAL_CONTEXT=""
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            ADDITIONAL_CONTEXT="$(printf '%s' "${COMMENT_BODY#@gemini-cli /review}" | sed 's/^[[:space:]]*//')"
          fi
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
          {
            echo "additional_context<<EOF"
            printf '%s\n' "${ADDITIONAL_CONTEXT}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Run Gemini pull request review
        uses: google-github-actions/run-gemini-cli@v0
        id: gemini_pr_review
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ steps.context.outputs.additional_context }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          workflow_name: 'gemini-review'
          github_pr_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "exclude": [
                  "run_shell_command",
                  "write_file",
                  "replace"
                ]
              }
            }
          extensions: |
            [
              "${{ runner.temp }}/gemini-code-review"
            ]
          prompt: '/pr-code-review Review GitHub PR #${{ github.event.pull_request.number || github.event.issue.number }} in repository ${{ github.repository }}. Read .gemini/context.json for any additional_context instructions. You MUST submit the review on GitHub using the GitHub MCP tools (pull_request_read, pull_request_review_write, add_comment_to_pending_review).'

      - name: Log Gemini CLI summary
        if: always()
        env:
          GEMINI_SUMMARY: '${{ steps.gemini_pr_review.outputs.summary }}'
          GEMINI_ERROR: '${{ steps.gemini_pr_review.outputs.error }}'
        run: |-
          echo "=== Gemini Summary ==="
          printf '%s\n' "${GEMINI_SUMMARY}"
          if [[ -n "${GEMINI_ERROR}" ]]; then
            echo "=== Gemini Error ==="
            printf '%s\n' "${GEMINI_ERROR}"
          fi
