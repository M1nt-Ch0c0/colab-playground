name: PR policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/*pr_policy.py'
      - '.github/pull_request_template.md'
      - '.github/workflows/pr-policy.yml'
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions: {}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_pr_policy.py'

  evaluate:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.issue.state == 'open' && github.event.comment.user.id == 199175422))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    concurrency:
      group: pr-policy-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      # This job can publish a commit status. Only execute code from the trusted base repository.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Evaluate the current PR and publish its head status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: python3 .github/scripts/pr_policy.py "$PR_NUMBER" --publish
