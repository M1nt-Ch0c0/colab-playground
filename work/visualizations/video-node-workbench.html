<section id="lunar-workbench" aria-label="静海来信视频节点工作台">
  <header class="lw-head">
    <div class="lw-identity"><i data-lucide="workflow" aria-hidden="true"></i><span>Colab Studio</span><span class="lw-slash">/</span><strong>静海来信</strong></div>
    <div class="lw-head-actions"><button type="button" data-act="undo" aria-label="撤销上次编辑">撤销</button><button type="button" data-act="run" class="lw-primary">预演本镜</button></div>
  </header>
  <div class="lw-layout">
    <div class="lw-main">
      <nav class="lw-bar" aria-label="工作区视图">
        <div class="lw-views"><button type="button" data-view="graph">节点图</button><button type="button" data-view="board">分镜板</button><button type="button" data-view="timeline">时间线</button></div>
        <button type="button" data-act="palette" aria-expanded="false">＋ 节点</button>
      </nav>
      <div class="lw-canvas" aria-label="可拖动、可连线的节点图">
        <div class="lw-world"><svg class="lw-wires" aria-hidden="true"></svg><div class="lw-nodes"></div></div>
        <div class="lw-zoom"><button type="button" data-act="smaller" aria-label="缩小画布">−</button><button type="button" data-act="fit">适配</button><button type="button" data-act="larger" aria-label="放大画布">＋</button></div>
        <div class="lw-palette" hidden></div>
      </div>
      <div class="lw-alternate" hidden></div>
      <div class="lw-strip"><div class="lw-strip-title"><strong>镜头</strong><span data-count></span></div><div class="lw-shots"></div></div>
    </div>
    <aside class="lw-inspector" aria-label="节点检查器">
      <nav class="lw-tabs" aria-label="检查器视图"><button type="button" data-tab="node">节点</button><button type="button" data-tab="vars">变量</button><button type="button" data-tab="ai">AI</button><button type="button" data-tab="log">运行</button></nav>
      <div class="lw-panel"></div>
    </aside>
  </div>
  <footer class="lw-foot"><span class="lw-feedback" role="status" aria-live="polite">拖动节点标题可布局，拖动端口可连线。</span><span>本地预演 · NASA 档案图</span></footer>
</section>
<style>
#lunar-workbench {
  color-scheme:light dark;
  --paper:light-dark(#f8fafb,#1e252a);--canvas:light-dark(#e8edf1,#151b1f);--panel:light-dark(#fff,#252d33);
  --ink:light-dark(#1b2935,#edf3f6);--sub:light-dark(#465a69,#b6c6d0);--line:light-dark(#cbd4dc,#43515b);
  --soft:light-dark(#e5ebf0,#35414a);--mark:light-dark(#0065b1,#75bfff);--tint:light-dark(#e1f0ff,#233d53);
  --image:light-dark(#20685a,#72c5ac);--text:light-dark(#624f8c,#bba4e4);--video:light-dark(#285d8d,#8cc2ed);--bad:light-dark(#9b3025,#ffb4a9);
  --ui:'Geist Variable',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --digits:ui-monospace,'SFMono-Regular',Consolas,monospace;
  width:100%;font:14px/1.45 var(--ui);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:13px;
  isolation:isolate;overflow:hidden;text-align:left;container-type:inline-size;
}
#lunar-workbench * {box-sizing:border-box}
#lunar-workbench [hidden] {display:none!important}
#lunar-workbench button,#lunar-workbench select,#lunar-workbench textarea,#lunar-workbench input {font:inherit;color:inherit}
#lunar-workbench button {appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px;min-height:30px;line-height:1.25;cursor:pointer}
#lunar-workbench button:hover:not(:disabled) {background:var(--soft)}
#lunar-workbench button:focus-visible,#lunar-workbench :is(input,select,textarea):focus-visible {outline:2px solid var(--mark);outline-offset:2px}
#lunar-workbench button:disabled {opacity:.45;cursor:default}
#lunar-workbench .lw-primary {background:var(--mark);border-color:var(--mark);color:light-dark(#fff,#132538);font-weight:600}
#lunar-workbench .lw-primary:hover:not(:disabled) {background:color-mix(in srgb,var(--mark) 86%,var(--ink));color:light-dark(#fff,#132538)}
#lunar-workbench strong {font-weight:650}
#lunar-workbench .lw-head,#lunar-workbench .lw-bar,#lunar-workbench .lw-foot,#lunar-workbench .lw-strip-title,#lunar-workbench .lw-row {display:flex;align-items:center;justify-content:space-between;gap:9px}
#lunar-workbench .lw-head {padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel)}
#lunar-workbench .lw-identity,#lunar-workbench .lw-head-actions,#lunar-workbench .lw-views,#lunar-workbench .lw-tabs,#lunar-workbench .lw-actions {display:flex;align-items:center;gap:6px}
#lunar-workbench .lw-identity {gap:10px;min-width:0;white-space:nowrap}
#lunar-workbench .lw-identity>svg {color:var(--mark);width:19px;height:19px}
#lunar-workbench .lw-identity>span:first-of-type {font-size:13px;color:var(--sub)}
#lunar-workbench .lw-identity>strong {font-size:16px;letter-spacing:.015em}
#lunar-workbench .lw-slash {color:var(--sub);opacity:.55}
#lunar-workbench .lw-layout {display:grid;grid-template-columns:minmax(0,1fr) 255px}
#lunar-workbench .lw-main,#lunar-workbench .lw-inspector,#lunar-workbench .lw-panel {min-width:0}
#lunar-workbench .lw-main {display:flex;flex-direction:column}
#lunar-workbench .lw-main>.lw-canvas,#lunar-workbench .lw-main>.lw-alternate {flex:1 0 auto}
#lunar-workbench .lw-inspector {border-left:1px solid var(--line);background:var(--panel)}
#lunar-workbench .lw-bar,#lunar-workbench .lw-tabs {height:43px;padding:0 11px;border-bottom:1px solid var(--line);background:var(--paper)}
#lunar-workbench .lw-views button,#lunar-workbench .lw-tabs button {border:0;background:transparent;color:var(--sub);border-radius:5px;white-space:nowrap}
#lunar-workbench .lw-views button[aria-pressed=true],#lunar-workbench .lw-tabs button[aria-pressed=true] {color:var(--mark);background:var(--tint);font-weight:650}
#lunar-workbench .lw-tabs {gap:2px;justify-content:space-between}
#lunar-workbench .lw-canvas {height:350px;position:relative;overflow:hidden;touch-action:none;background-color:var(--canvas);
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--sub) 25%,transparent) .85px,transparent .95px);background-size:16px 16px}
#lunar-workbench .lw-world {position:absolute;left:0;top:0;transform-origin:0 0}
#lunar-workbench .lw-nodes,#lunar-workbench .lw-wires {position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#lunar-workbench .lw-wires {pointer-events:none}
#lunar-workbench .lw-wires path {fill:none;stroke-width:2.2;opacity:.85}
#lunar-workbench .lw-card {width:158px;position:absolute;overflow:visible;background:var(--panel);border:1px solid var(--line);border-radius:9px}
#lunar-workbench .lw-card.current {border-color:var(--mark);outline:1px solid var(--mark)}
#lunar-workbench .lw-card-title {display:flex;align-items:center;gap:6px;width:100%;text-align:left;cursor:grab;border:0;border-radius:9px 9px 0 0;background:transparent;padding:7px 9px;touch-action:none;font-weight:650}
#lunar-workbench .lw-card-title:active {cursor:grabbing}
#lunar-workbench .lw-card-title svg {width:15px;height:15px;flex:none;color:var(--sub)}
#lunar-workbench .lw-card-title span {flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#lunar-workbench .lw-card-body {padding:0 8px 5px;color:var(--sub);font-size:12px;min-height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lunar-workbench .lw-card-img {display:block;width:calc(100% - 12px);height:58px;object-fit:cover;margin:0 6px 4px;border-radius:4px;background:var(--canvas)}
#lunar-workbench .lw-media {position:relative}
#lunar-workbench .lw-media small {position:absolute;left:9px;bottom:3px;background:#171a1cce;color:#f6f8fa;font:11px/1.35 var(--digits);padding:0 4px;border-radius:2px}
#lunar-workbench .lw-card-status {display:block;margin:0 8px 4px;color:var(--sub);font-size:11.5px}
#lunar-workbench .lw-card-status.ready {color:var(--image)}
#lunar-workbench .lw-ports {display:grid;grid-template-columns:1fr 1fr;min-height:22px;gap:1px 3px;padding:0 2px 4px}
#lunar-workbench .lw-portstack {display:flex;flex-direction:column;align-items:flex-start}
#lunar-workbench .lw-portstack.out {align-items:flex-end}
#lunar-workbench .lw-port {display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:2px 3px;min-height:22px;font-size:11.5px;color:var(--sub);touch-action:none;white-space:nowrap}
#lunar-workbench .lw-port.picked {background:var(--tint);color:var(--mark)}
#lunar-workbench .lw-dot {width:9px;height:9px;background:var(--pcolor);display:inline-block;flex:none;border-radius:50%}
#lunar-workbench .lw-dot[data-type=text] {border-radius:1px;transform:rotate(45deg);width:7px;height:7px}
#lunar-workbench .lw-dot[data-type=video] {border-radius:2px}
#lunar-workbench .lw-zoom {position:absolute;bottom:8px;left:9px;display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:1px}
#lunar-workbench .lw-zoom button {background:transparent;border:0;padding:4px 8px;font-size:12px}
#lunar-workbench .lw-palette {position:absolute;right:10px;top:8px;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;display:grid;gap:3px}
#lunar-workbench .lw-palette button {text-align:left;border:0;background:transparent;cursor:grab}
#lunar-workbench .lw-strip {border-top:1px solid var(--line);padding:9px 12px 12px}
#lunar-workbench .lw-strip-title {justify-content:flex-start;margin-bottom:6px;font-size:12px}
#lunar-workbench .lw-strip-title span,#lunar-workbench .lw-muted {color:var(--sub);font-size:12px}
#lunar-workbench .lw-shots {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#lunar-workbench .lw-shot {display:grid;grid-template-columns:42px minmax(0,1fr);gap:7px;align-items:center;text-align:left;padding:3px;background:var(--panel)}
#lunar-workbench .lw-shot img {width:42px;height:35px;object-fit:cover;border-radius:3px;background:var(--canvas)}
#lunar-workbench .lw-shot span {display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
#lunar-workbench .lw-shot small {display:block;color:var(--sub);font:11px/1.35 var(--digits)}
#lunar-workbench .lw-shot[aria-pressed=true],#lunar-workbench .lw-board-item[aria-pressed=true] {border-color:var(--mark);background:var(--tint)}
#lunar-workbench .lw-panel {padding:13px;display:grid;gap:11px;align-content:start}
#lunar-workbench h3,#lunar-workbench h4,#lunar-workbench p {margin:0}
#lunar-workbench .lw-panel h3,#lunar-workbench .lw-alt-head h3 {font-size:16px;line-height:1.3}
#lunar-workbench .lw-kv,#lunar-workbench .lw-form {display:grid;gap:4px;font-size:12px;color:var(--sub)}
#lunar-workbench .lw-form input,#lunar-workbench .lw-form select,#lunar-workbench .lw-form textarea {width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:var(--paper);color:var(--ink);font-size:13px}
#lunar-workbench .lw-form textarea {resize:vertical;min-height:55px}
#lunar-workbench .lw-actions {flex-wrap:wrap}
#lunar-workbench .lw-output,#lunar-workbench .lw-diff {padding:7px 9px;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);color:var(--ink);font-size:12px}
#lunar-workbench .lw-diff.add {background:var(--tint)}
#lunar-workbench .lw-fields,#lunar-workbench .lw-log {display:grid;gap:7px}
#lunar-workbench .lw-ins-preview {display:block;width:100%;height:88px;object-fit:cover;border-radius:6px}
#lunar-workbench .lw-log p {border-top:1px solid var(--line);padding-top:6px;color:var(--sub);font-size:12px}
#lunar-workbench .lw-danger {color:var(--bad)}
#lunar-workbench .lw-alternate {padding:14px;min-height:350px;background:var(--canvas)}
#lunar-workbench .lw-alt-head {display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#lunar-workbench .lw-board {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#lunar-workbench .lw-board-item {padding:0 0 8px;text-align:left;overflow:hidden}
#lunar-workbench .lw-board-item img {width:100%;height:105px;object-fit:cover;display:block;margin-bottom:6px}
#lunar-workbench .lw-board-item b,#lunar-workbench .lw-board-item small {display:block;margin:0 7px;overflow-wrap:anywhere}
#lunar-workbench .lw-board-item small {color:var(--sub);font-size:12px}
#lunar-workbench .lw-player {width:100%;height:136px;object-fit:contain;background:#171a1c;display:block;border-radius:5px}
#lunar-workbench .lw-track {display:flex;gap:2px;margin:9px 0;align-items:stretch;min-height:32px}
#lunar-workbench .lw-track button {border:1px solid var(--line);min-width:0;overflow:hidden;padding:4px 2px;font:12px var(--digits)}
#lunar-workbench .lw-track button[aria-pressed=true] {background:var(--tint);color:var(--mark);border-color:var(--mark)}
#lunar-workbench .lw-transport {display:flex;align-items:center;gap:10px;font:12px var(--digits)}
#lunar-workbench .lw-transport input {min-width:0;flex:1;accent-color:var(--mark)}
#lunar-workbench .lw-edits {display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;margin-top:9px}
#lunar-workbench .lw-edits label {width:78px}
#lunar-workbench .lw-foot {padding:6px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--sub);min-height:29px}
#lunar-workbench .lw-feedback {color:var(--ink)}
#lunar-workbench .lw-foot span:last-child {flex-shrink:0}
@container (max-width:830px) {
  #lunar-workbench .lw-layout {grid-template-columns:minmax(0,1fr)}
  #lunar-workbench .lw-inspector {border-left:0;border-top:1px solid var(--line)}
  #lunar-workbench .lw-tabs {justify-content:flex-start}
  #lunar-workbench .lw-panel {grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  #lunar-workbench .lw-panel>.lw-row:first-child {grid-column:1/-1}
}
@container (max-width:550px) {
  #lunar-workbench .lw-head {padding:8px;gap:4px}
  #lunar-workbench .lw-identity {gap:5px}
  #lunar-workbench .lw-identity>span:first-of-type,#lunar-workbench .lw-slash {display:none}
  #lunar-workbench .lw-head-actions {gap:4px}
  #lunar-workbench .lw-canvas {height:479px}
  #lunar-workbench .lw-card {width:147px}
  #lunar-workbench .lw-card-img {height:41px}
  #lunar-workbench .lw-strip {padding:7px}
  #lunar-workbench .lw-shot {grid-template-columns:1fr;padding:3px}
  #lunar-workbench .lw-shot img {width:100%;height:32px}
  #lunar-workbench .lw-shot span {padding:0 2px}
  #lunar-workbench .lw-foot {display:grid;gap:2px}
  #lunar-workbench .lw-panel {grid-template-columns:minmax(0,1fr)}
  #lunar-workbench .lw-board {grid-template-columns:repeat(2,minmax(0,1fr))}
  #lunar-workbench .lw-board-item img {height:77px}
}
@media (pointer:coarse) {
  #lunar-workbench .lw-head button,#lunar-workbench .lw-bar button,#lunar-workbench .lw-tabs button,#lunar-workbench .lw-panel button {min-height:40px}
  #lunar-workbench .lw-port {min-height:26px}
}
</style>

      p.append(el('p','lw-muted','被引用于 '+(refs.length?refs.map(n=>catalog[n.kind].label).join('、'):'尚无节点')));
    }
  }
  function aiProposal(n,kind) {
    const before=templ(n),k=catalog[n.kind];
    const nameOf=id=>{const node=byId(id),label=catalog[node.kind].label;return state.nodes.filter(item=>item.kind===node.kind).length>1?label+' ('+id+')':label;};
    const affected=Array.from(descend(n.id),nameOf);
    if(kind==='grade'){
      if(!k.out.video)return {error:'请选择有视频输出的节点。'};
      if(state.nodes.length>=20)return {error:'样例画布已满。'};
      const targets=state.edges.filter(edge=>edge[0]===n.id&&edge[1]==='video').map(edge=>nameOf(edge[2])+' / '+catalog[byId(edge[2]).kind].ins[edge[3]][1]);
      const destination=targets.join('、'),source=nameOf(n.id)+' / '+k.out.video;
      return {kind:'grade',scope:'仅 '+shortId(shot())+' · '+shot().title,owner:n.id,shot:state.shot,before:source+(destination?' → '+destination:'，尚未接下游'),after:source+' → 画面调色（'+shortId(shot())+'）'+(destination?' → '+destination:''),reason:'需要更新'+['画面调色',...affected.slice(1)].join('、')+'。其他镜头沿用原片段，可复用现有结果。'};
    }
    if(kind==='wire'){
      const missing=Object.entries(k.ins).find(([id])=>!state.edges.some(e=>e[2]===n.id&&e[3]===id));
      if(!missing)return {error:'这个节点的必需输入都已连接。'};
      const [port,[type,label]]=missing;
      const candidate=state.nodes.find(v=>v.id!==n.id && Object.hasOwn(catalog[v.kind].out,type) && !descend(n.id).has(v.id));
      if(!candidate)return {error:'画布上缺少相容上游。可从节点库添加'+typeLabel(type)+'来源。'};
      return {kind:'wire',scope:'项目共用连线 · 全部 '+state.shots.length+' 镜',owner:n.id,shot:state.shot,source:candidate.id,type,port,before:nameOf(n.id)+' / '+label+' 未连接',after:nameOf(candidate.id)+' / '+catalog[candidate.kind].out[type]+' → '+nameOf(n.id)+' / '+label,reason:'采用后，'+state.shots.map(shortId).join('、')+' 都会更新。受影响的节点包括'+affected.join('、')+'。'};
    }
    if(before.includes(k.suggest))return {error:'当前镜头已采用这条示例建议。'};
    return {kind:'text',scope:'仅 '+shortId(shot())+' · '+shot().title,owner:n.id,shot:state.shot,before,after:(before+' '+k.suggest).trim().slice(0,450),reason:'修改本镜的'+k.field+'。受影响的节点包括'+affected.join('、')+'。'};
  }
  function insertNode(kind,x,y) {
    const id='n'+state.next++,m=isSmall(),safe=(v,low,high)=>Math.min(high,Math.max(low,v));
    const n=makeNode(id,kind,m?343:safe(x,5,1800),m?200:safe(y,5,850),m?safe(x,5,800):90,m?safe(y,5,850):205);
    state.nodes.push(n);return n;
  }
  function applyProposal(){
    if(!pending || pending.error)return;
    const n=byId(pending.owner);if(!n||n.locked||pending.shot!==state.shot)return say('节点或镜头已变更，请重新查看提案。');
    const a=pending;
    if(a.kind==='wire'){connect({id:a.source,port:a.type},n.id,a.port);return;}
    if(a.kind==='text' && a.before!==templ(n))return say('字段已有新版本，请重新生成建议。');
    const children=state.edges.filter(e=>e[0]===n.id && e[1]==='video');
    if(a.kind==='grade' && children.some(e=>byId(e[2]).locked))return say('下游锁定了输入。请先解锁或选择其他接点。');
    remember();
    if(a.kind==='text'){n.overrides[state.shot]=a.after;invalidate(n.id,state.shot);}
    else {
      const pos=n[place()],g=insertNode('grade',pos[0]+44,pos[1]+153);
      g.shotFilter=a.shot;
      children.forEach(e=>{e[0]=g.id;});state.edges.push([n.id,'video',g.id,'clip']);invalidate(g.id,a.shot);
    }
    log('应用 AI 样例提案 · '+catalog[n.kind].label);after('建议已应用，可通过撤销恢复。');
    if(a.kind==='grade')requestAnimationFrame(fit);
  }
  function showAI(p,n,k){
    p.append(panelHeading('节点 AI',k.label));
    p.append(field('介入方式',select(Object.entries(activePolicies),n.policy,v=>{remember();n.policy=v;after('已更新此节点的 AI 规则。');},'AI 介入方式')));
    const modes=[['text','改进本镜参数'],['wire','检查并补全输入']];
    if(k.out.video)modes.push(['grade','只给本镜插入调色节点']);
    if(!modes.some(([id])=>id===aiTask))aiTask='text';
    const use=select(modes,aiTask,v=>{aiTask=v;pending=null;drawPanel();},'AI 任务');
    p.append(field('本次任务',use));
    p.append(action('生成示例提案',()=>{
      pending=aiProposal(n,use.value);
      if(n.policy==='auto'&&!n.locked&&pending.kind==='text'&&!pending.error){applyProposal();return;}
      drawPanel();
    },{cl:'lw-primary',disabled:n.locked||n.policy==='off'}));
    if(n.locked)p.append(el('p','lw-danger','节点已锁定，请在“节点”页解锁后再改动。'));
    if(pending){
      if(pending.error)p.append(el('p','lw-output',pending.error));
      else{
        const before=el('div','lw-kv','当前'),afterBox=el('div','lw-kv','提议');before.append(el('p','lw-diff',pending.before));afterBox.append(el('p','lw-diff add',pending.after));
        const acts=el('div','lw-actions');acts.append(action('采用建议',applyProposal,{cl:'lw-primary',disabled:n.locked}),action('舍弃',()=>{pending=null;drawPanel();}));
        p.append(el('strong','',pending.scope),before,afterBox,el('p','lw-muted',pending.reason),acts);
      }
    }
    p.append(el('p','lw-muted','此处演示预设提案，不调用在线模型。'));
  }
  function showLog(p){
    p.append(panelHeading('运行记录',shortId(shot())));
    const actions=el('div','lw-actions');actions.append(action('预演到所选节点',()=>run(selected().id)),action('预演本镜全图',()=>run(null)));p.append(actions);
    const list=el('div','lw-log');if(!state.logs.length)list.append(el('p','','还没有预演记录。'));
    state.logs.forEach(s=>list.append(el('p','',s)));p.append(list);
  }
  function drawPanel(){
    all('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===state.tab?'true':'false'));
    const p=$('.lw-panel'),n=selected();p.replaceChildren();
    if(state.tab==='node')showNode(p,n,catalog[n.kind]);
    if(state.tab==='vars')showVariables(p);
    if(state.tab==='ai')showAI(p,n,catalog[n.kind]);
    if(state.tab==='log')showLog(p);
  }
  function plan(target) {
    const visited=new Set(),stack=new Set(),order=[];
    function visit(n){
      if(visited.has(n.id))return;
      if(stack.has(n.id))throw new Error('图中有循环，请断开一条回边。');
      stack.add(n.id);
      for(const [id,[,label]] of Object.entries(catalog[n.kind].ins)){
        const e=state.edges.find(item=>item[2]===n.id&&item[3]===id);if(!e)throw new Error(catalog[n.kind].label+' 缺少'+label+'输入。请连接端口。');
        visit(byId(e[0]));
      }
      if(n.shotFilter && n.shotFilter!==state.shot){stack.delete(n.id);visited.add(n.id);return;}
      const invalid=resolve(templ(n)).missing;
      if(invalid.length)throw new Error(catalog[n.kind].label+' 引用无效变量 '+invalid.join('、')+'。');
      stack.delete(n.id);visited.add(n.id);order.push(n);
    }
    (target?[byId(target)]:state.nodes).filter(Boolean).forEach(visit);return order;
  }
  function run(target){
    if(waitingRun)return;
    try{
      const order=plan(target),prefix=shortId(shot()),updated=[],cached=[];
      for(const n of order){const key=state.shot+'/'+n.id;if(state.cache[key])cached.push(catalog[n.kind].label);else{state.cache[key]=true;updated.push(catalog[n.kind].label);}}
      const note=prefix+' · 预演 '+updated.length+'，复用 '+cached.length;
      if(cached.length)log('复用 · '+cached.join(' → '));if(updated.length)log('执行顺序 · '+updated.join(' → '));log(note);
      state.tab='log';after(note+'。没有提交 GPU 任务。');
    }catch(e){log('预演中止 · '+e.message);state.tab='log';after(e.message);}
  }
  function startOf(id){let t=0;for(const item of state.shots){if(item.id===id)return t;t+=used(item);}return 0;}
  const total=()=>state.shots.reduce((v,s)=>v+used(s),0);
  function stopClock(){if(clock!==null){clearInterval(clock);clock=null;}}
  function syncTime(v){
    time=Math.min(Math.max(0,v),total());
    let cumulative=0;const match=state.shots.find(item=>{cumulative+=used(item);return time<cumulative;})||state.shots.at(-1);
    if(state.shot!==match.id){state.shot=match.id;pending=null;render();}
    const range=$('[data-time]'),label=$('[data-time-label]');if(range)range.value=String(time);if(label)label.textContent=seconds(time)+' / '+seconds(total());
  }
  function drawStrip(){
    const strip=$('.lw-shots');strip.replaceChildren();
    $('[data-count]').textContent=state.shots.length+' 镜 · '+seconds(total());
    for(const s of state.shots){
      const b=el('button','lw-shot');b.type='button';b.dataset.shot=s.id;b.setAttribute('aria-pressed',state.shot===s.id?'true':'false');
      const label=el('span','',s.title);label.append(el('small','',shortId(s)+' · '+seconds(used(s))));b.append(pic(s),label);b.addEventListener('click',()=>pickShot(s.id));strip.append(b);
    }
  }
  function chooseTake(s,t){
    if(s.take===t)return;remember();s.take=t;
    state.nodes.filter(n=>n.kind==='source').forEach(n=>invalidate(n.id,s.id));log(shortId(s)+' 采用参考底片 '+t);after('已采用该镜头参考版本，其他镜头可继续复用。');
  }
  function drawAlt(){
    const container=$('.lw-alternate');container.replaceChildren();if(state.view==='graph')return;
    if(state.view==='board'){
      const head=el('div','lw-alt-head');head.append(el('h3','','分镜板'),el('span','lw-muted','3 镜 · '+seconds(total())));container.append(head);
      const grid=el('div','lw-board');
      for(const item of state.shots){
        const b=el('button','lw-board-item');b.type='button';b.setAttribute('aria-pressed',state.shot===item.id?'true':'false');b.addEventListener('click',()=>pickShot(item.id));
        b.append(pic(item),el('b','',item.title),el('small','',shortId(item)+' · '+seconds(used(item))+' · 版本 '+item.take));grid.append(b);
      }
      const row=el('div','lw-edits');row.append(el('strong','',shot().title+' · 参考版本'));
      for(const t of ['A','B']){const b=action(t==='A'?'A 原片':'B 对比样张',()=>chooseTake(shot(),t));b.setAttribute('aria-pressed',shot().take===t?'true':'false');row.append(b);}
      container.append(grid,row);return;
    }
    const s=shot(),head=el('div','lw-alt-head');head.append(el('h3','','剪辑时间线'),el('span','lw-muted','24 fps · 静帧预演'));container.append(head,pic(s,'lw-player'));
    const track=el('div','lw-track');
    for(const item of state.shots){const b=action(shortId(item),()=>pickShot(item.id),{aria:'定位 '+item.title});b.style.flex=String(used(item))+' 1 0';b.setAttribute('aria-pressed',item.id===s.id?'true':'false');track.append(b);}
    const transport=el('div','lw-transport');
    const play=action(clock===null?'播放':'暂停',()=>{
      if(clock!==null){stopClock();drawAlt();return;}
      if(time>=total())syncTime(0);
      let last=performance.now();clock=setInterval(()=>{const now=performance.now();const t=time+(now-last)/1000;last=now;syncTime(t);if(t>=total()){stopClock();drawAlt();save();}},160);drawAlt();
    });
    const slider=el('input');slider.type='range';slider.min='0';slider.max=String(total());slider.step=String(1/24);slider.value=String(time);slider.dataset.time='';slider.setAttribute('aria-label','播放头秒数');
    slider.addEventListener('input',()=>{stopClock();syncTime(Number(slider.value));play.textContent='播放';});
    const timer=el('span','',seconds(time)+' / '+seconds(total()));timer.dataset.timeLabel='';transport.append(play,slider,timer);
    const edits=el('div','lw-edits'),cut=el('input');cut.type='number';cut.min='0';cut.max=String(duration(s)-.25);cut.step='.25';cut.value=String(s.trim);
    const updateTrim=()=>{const nv=Number(cut.value);if(!Number.isFinite(nv)||nv<0||nv>duration(s)-.25||Math.round(nv*4)!==nv*4)return say('裁尾按 0.25 秒递增，至少保留 0.25 秒。');
      remember();s.trim=nv;stopClock();time=Math.min(time,total());state.nodes.filter(n=>n.kind==='cut').forEach(n=>invalidate(n.id,s.id));after('已更新剪辑点，生成片段可复用。');};
    const order=state.shots.indexOf(s);
    function move(dir){remember();stopClock();state.shots.splice(order,1);state.shots.splice(order+dir,0,s);time=startOf(s.id);state.nodes.filter(n=>n.kind==='cut').forEach(n=>invalidate(n.id));after('已按新顺序排片，镜头参数仍绑定原镜。');}
    edits.append(field('裁尾秒数',cut),action('应用剪辑',updateTrim),action('前移',()=>move(-1),{disabled:order===0}),action('后移',()=>move(1),{disabled:order===state.shots.length-1}));
    container.append(track,transport,edits);
  }
  function showPalette(){
    const box=$('.lw-palette');box.replaceChildren();box.hidden=!palette;$('[data-act=palette]').setAttribute('aria-expanded',String(palette));
    if(!palette)return;
    for(const [kind,k] of Object.entries(catalog)){
      const b=action(k.label,()=>add(kind));b.draggable=true;b.addEventListener('dragstart',e=>{e.dataTransfer.setData('application/x-lunar-node',kind);e.dataTransfer.effectAllowed='copy';});box.append(b);
    }
  }
  function add(kind,xy){
    if(!catalog[kind])return;if(state.nodes.length>=20)return say('交互样例最多显示 20 个节点。');
    remember();const i=state.next,pos=xy||[isSmall()?46:230+(i%4)*42,isSmall()?335+i*12:242+(i%4)*22];const n=insertNode(kind,pos[0],pos[1]);
    state.selected=n.id;state.tab='node';palette=false;linking=null;after('已添加'+catalog[kind].label+'。请连接所需端口。');if(!xy)requestAnimationFrame(fit);
  }
  function render(){
    const graph=state.view==='graph';$('.lw-canvas').hidden=!graph;$('.lw-alternate').hidden=graph;
    all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view?'true':'false'));
    $('[data-act=undo]').disabled=!history.length;
    drawGraph();drawAlt();drawStrip();drawPanel();showPalette();icons();
  }
  function undo(){
    if(!history.length)return;stopClock();state=history.pop();pending=null;linking=null;palette=false;time=startOf(shot().id);after('已撤销上次编辑。');requestAnimationFrame(fit);
  }
  function zoom(factor){
    const c=$('.lw-canvas'),cx=c.clientWidth/2,cy=c.clientHeight/2,prev=scale;
    scale=Math.max(.36,Math.min(2.35,scale*factor));dx=cx-(cx-dx)*scale/prev;dy=cy-(cy-dy)*scale/prev;transform();wires();
  }
  function clickPort(p){
    if(p.dataset.side==='out'){
      linking={id:p.dataset.node,port:p.dataset.port};drawGraph();say('已选'+typeLabel(p.dataset.type)+'输出，请点相容输入，Esc 取消。');return;
    }
    if(linking){connect(linking,p.dataset.node,p.dataset.port);return;}
    chooseNode(p.dataset.node);say('可先选一个输出再点此输入，或使用检查器里的输入下拉框。');
  }
  root.addEventListener('click',e=>{
    if(skipClick){skipClick=false;return;}
    const portEl=e.target.closest('.lw-port');if(portEl){clickPort(portEl);return;}
    const title=e.target.closest('.lw-card-title');if(title){chooseNode(title.dataset.node);return;}
    const view=e.target.closest('[data-view]');if(view){stopClock();state.view=view.dataset.view;palette=false;linking=null;render();if(state.view==='graph')requestAnimationFrame(fit);save();return;}
    const tab=e.target.closest('[data-tab]');if(tab){pending=null;state.tab=tab.dataset.tab;drawPanel();save();return;}
    const btn=e.target.closest('[data-act]');if(!btn)return;
    const act=btn.dataset.act;
    if(act==='undo')undo();
    if(act==='run')run(null);
    if(act==='palette'){if(state.view!=='graph'){stopClock();state.view='graph';render();requestAnimationFrame(fit);}palette=!palette;showPalette();}
    if(act==='fit')fit();if(act==='larger')zoom(1.2);if(act==='smaller')zoom(1/1.2);
  });
  const canvas=$('.lw-canvas');
  canvas.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('application/x-lunar-node'))e.preventDefault();});
  canvas.addEventListener('drop',e=>{e.preventDefault();const kind=e.dataTransfer.getData('application/x-lunar-node');add(kind,coords(e.clientX,e.clientY));});
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.lw-zoom,.lw-palette'))return;
    const p=e.target.closest('.lw-port'),h=e.target.closest('.lw-card-title');
    if(p&&p.dataset.side!=='out')return;
    const base={pid:e.pointerId,sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY,moved:false};
    if(p){pointer={...base,kind:'edge',id:p.dataset.node,port:p.dataset.port};return;}
    if(h){const n=byId(h.dataset.node);pointer={...base,kind:'node',id:n.id,original:n[place()].slice(),attr:place()};return;}
    if(e.target.closest('.lw-card'))return;pointer={...base,kind:'pan',x:dx,y:dy};
  });
  window.addEventListener('pointermove',e=>{
    if(!pointer||pointer.pid!==e.pointerId)return;
    const p=pointer,x=e.clientX-p.sx,y=e.clientY-p.sy;
    if(!p.moved&&Math.hypot(x,y)<4)return;
    if(!p.moved){p.moved=true;if(p.kind==='node'){remember();chooseNode(p.id,false);}if(p.kind==='edge')linking=null;}
    e.preventDefault();p.cx=e.clientX;p.cy=e.clientY;
    if(p.kind==='node'){const n=byId(p.id);n[p.attr]=[Math.max(0,Math.round(p.original[0]+x/scale)),Math.max(0,Math.round(p.original[1]+y/scale))];
      const card=all('.lw-card').find(v=>v.dataset.id===p.id);card.style.left=n[p.attr][0]+'px';card.style.top=n[p.attr][1]+'px';wires();}
    if(p.kind==='pan'){dx=p.x+x;dy=p.y+y;transform();}
    if(p.kind==='edge')wires();
  },{passive:false});
  window.addEventListener('pointerup',e=>{
    if(!pointer||pointer.pid!==e.pointerId)return;
    const p=pointer;pointer=null;if(!p.moved)return;
    if(p.kind==='edge'){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.lw-port[data-side=in]');
      if(target&&root.contains(target))connect({id:p.id,port:p.port},target.dataset.node,target.dataset.port);else say('连接已取消。请把输出拖到输入端口。');wires();}
    if(p.kind==='node'){drawGraph();save();say('已保存画布位置，现有产物可复用。');}
    skipClick=true;setTimeout(()=>{skipClick=false;},0);
  });
  window.addEventListener('pointercancel',()=>{pointer=null;wires();});
  root.addEventListener('keydown',e=>{
    if(e.key==='Escape'){palette=false;linking=null;pointer=null;showPalette();drawGraph();say('已取消当前操作。');return;}
    if(e.target.closest('input,textarea,select'))return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
    const h=e.target.closest('.lw-card-title');if(!h||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;
    e.preventDefault();remember();const n=byId(h.dataset.node),d=e.shiftKey?20:6,xy=n[place()];xy[0]=Math.max(0,xy[0]+(e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0));xy[1]=Math.max(0,xy[1]+(e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0));state.selected=n.id;render();all('.lw-card-title').find(x=>x.dataset.node===n.id)?.focus();save();
  });
  let lastSize='',lastWidth=0;
  const resize=new ResizeObserver(()=>{
    if(!canvas.clientWidth || state.view!=='graph')return;
    const size=canvas.clientWidth+'x'+canvas.clientHeight;
    if(lastSize===size)return;
    if(lastWidth!==root.clientWidth){lastWidth=root.clientWidth;drawGraph();}
    lastSize=size;fit();
  });
  resize.observe(canvas);
  window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(valid(s)&&JSON.stringify(s)!==JSON.stringify(state)){
    stopClock();state=structuredClone(s);pending=null;linking=null;history=[];time=startOf(shot().id);render();requestAnimationFrame(fit);
  }});
  time=startOf(shot().id);render();requestAnimationFrame(fit);
  if(globalThis.Tweak){const layout={ruler:16};const t=new Tweak({container:root,onChange:()=>{$('.lw-canvas').style.backgroundSize=layout.ruler+'px '+layout.ruler+'px';}});t.addSlider(layout,'ruler',{label:'画布网格',min:12,max:24,step:2,unit:'px'});}
})();
</script>
